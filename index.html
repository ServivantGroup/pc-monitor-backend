<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>PC Monitor</title>
  <link rel="manifest" href="manifest.json" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0a;
      --surface: #111111;
      --surface2: #181818;
      --border: #222222;
      --border-on: rgba(34,197,94,0.3);
      --text: #ffffff;
      --text2: #888888;
      --text3: #444444;
      --green: #22c55e;
      --green-dim: rgba(34,197,94,0.12);
      --red: #ef4444;
      --red-dim: rgba(239,68,68,0.10);
      --mono: 'Space Mono', monospace;
      --sans: 'DM Sans', sans-serif;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100dvh;
      padding: env(safe-area-inset-top, 20px) 0 env(safe-area-inset-bottom, 20px);
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 20px 0;
      margin-bottom: 4px;
    }
    .logo {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 700;
      color: var(--text3);
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    .refresh-btn {
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: 50%;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text3);
      font-size: 16px;
      transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .refresh-btn:active { background: var(--surface2); transform: rotate(180deg); }
    .last-update {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text3);
      padding: 8px 20px 18px;
    }
    .devices {
      padding: 0 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .device-card {
      background: var(--surface);
      border-radius: 20px;
      border: 0.5px solid var(--border);
      padding: 18px;
      transition: border-color 0.4s;
      position: relative;
      overflow: hidden;
    }
    .device-card.online { border-color: var(--border-on); }
    .top-line {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent 0%, var(--green) 50%, transparent 100%);
      opacity: 0;
      transition: opacity 0.4s;
    }
    .device-card.online .top-line { opacity: 1; }
    .card-top {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }
    .dot-wrap {
      position: relative;
      width: 40px;
      height: 40px;
      flex-shrink: 0;
    }
    .pulse {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: var(--green-dim);
      animation: pulse 2.2s ease-out infinite;
    }
    .device-card.offline .pulse { display: none; }
    @keyframes pulse {
      0%   { transform: scale(0.75); opacity: 1; }
      100% { transform: scale(1.45); opacity: 0; }
    }
    .dot-icon {
      position: absolute;
      inset: 6px;
      border-radius: 50%;
      background: var(--green);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
    }
    .device-card.offline .dot-icon {
      background: var(--surface2);
      border: 1px solid #2e2e2e;
    }
    .card-info { flex: 1; min-width: 0; }
    .card-name {
      font-size: 16px;
      font-weight: 500;
      margin-bottom: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-id {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text3);
    }
    .badge {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 100px;
      letter-spacing: 0.1em;
      flex-shrink: 0;
    }
    .badge-on  { background: var(--green-dim); color: var(--green); border: 0.5px solid rgba(34,197,94,0.3); }
    .badge-off { background: var(--red-dim);   color: var(--red);   border: 0.5px solid rgba(239,68,68,0.2); }
    .card-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }
    .stat {
      background: var(--surface2);
      border-radius: 10px;
      padding: 9px 11px;
    }
    .stat-label {
      font-family: var(--mono);
      font-size: 9px;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 4px;
    }
    .stat-val {
      font-size: 13px;
      font-weight: 500;
      color: var(--text2);
    }
    .stat-val.g { color: var(--green); }
    .stat-val.r { color: var(--red); }
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text3);
      font-family: var(--mono);
      font-size: 12px;
      line-height: 2.2;
    }
    .config-box {
      margin: 20px 14px 0;
      background: var(--surface);
      border-radius: 16px;
      border: 0.5px solid var(--border);
      padding: 14px;
    }
    .config-label {
      font-family: var(--mono);
      font-size: 9px;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 10px;
    }
    .config-row { display: flex; align-items: center; gap: 8px; }
    .url-input {
      flex: 1;
      background: var(--surface2);
      border: 0.5px solid var(--border);
      border-radius: 8px;
      padding: 9px 11px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 11px;
      outline: none;
    }
    .url-input:focus { border-color: #333; }
    .save-btn {
      background: var(--green);
      color: #000;
      border: none;
      border-radius: 8px;
      padding: 9px 14px;
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      white-space: nowrap;
    }
    .save-btn:active { opacity: 0.75; }
    .install-hint {
      margin: 14px 14px 0;
      background: var(--green-dim);
      border: 0.5px solid rgba(34,197,94,0.2);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 12px;
      color: var(--text2);
      line-height: 1.7;
      display: none;
    }
    .install-hint strong { color: var(--green); }
  </style>
</head>
<body>

<header>
  <span class="logo">PC Monitor</span>
  <button class="refresh-btn" onclick="fetchStatus()" title="Actualizar">↻</button>
</header>
<div class="last-update" id="lastUpdate">Conectando...</div>

<div class="devices" id="deviceList">
  <div class="empty-state">Conectando con el servidor...<br/>Configura la URL abajo</div>
</div>

<div class="config-box">
  <div class="config-label">URL del servidor</div>
  <div class="config-row">
    <input class="url-input" id="serverUrl" type="url" placeholder="https://tu-app.onrender.com" />
    <button class="save-btn" onclick="saveUrl()">Guardar</button>
  </div>
</div>

<div class="install-hint" id="installHint">
  <strong>Instalar como app:</strong> toca los tres puntos de Chrome y selecciona "Añadir a pantalla de inicio".
</div>

<script>
let serverUrl = localStorage.getItem('serverUrl') || '';
let interval = null;
document.getElementById('serverUrl').value = serverUrl;

function saveUrl() {
  serverUrl = document.getElementById('serverUrl').value.trim().replace(/\/$/, '');
  localStorage.setItem('serverUrl', serverUrl);
  fetchStatus();
}

function ago(sec) {
  if (sec < 60) return `hace ${sec}s`;
  const m = Math.floor(sec / 60);
  if (m < 60) return `hace ${m}m`;
  const h = Math.floor(m / 60);
  return `hace ${h}h ${m % 60}m`;
}

function renderDevices(list) {
  const el = document.getElementById('deviceList');
  if (!list || list.length === 0) {
    el.innerHTML = '<div class="empty-state">Sin dispositivos aún.<br/>Ejecuta el script en tu PC.</div>';
    return;
  }
  el.innerHTML = list.map(d => `
    <div class="device-card ${d.online ? 'online' : 'offline'}">
      <div class="top-line"></div>
      <div class="card-top">
        <div class="dot-wrap">
          <div class="pulse"></div>
          <div class="dot-icon">${d.online ? '🖥' : '💤'}</div>
        </div>
        <div class="card-info">
          <div class="card-name">${d.name}</div>
          <div class="card-id">${d.id}</div>
        </div>
        <span class="badge ${d.online ? 'badge-on' : 'badge-off'}">${d.online ? 'ON' : 'OFF'}</span>
      </div>
      <div class="card-stats">
        <div class="stat">
          <div class="stat-label">Última señal</div>
          <div class="stat-val ${d.online ? 'g' : 'r'}">${d.ago !== null ? ago(d.ago) : "sin datos aún"}</div>
        </div>
        <div class="stat">
          <div class="stat-label">Estado</div>
          <div class="stat-val ${d.online ? 'g' : ''}">${d.online ? 'Encendido' : 'Apagado'}</div>
        </div>
      </div>
    </div>`).join('');
}

async function fetchStatus() {
  if (!serverUrl) {
    document.getElementById('lastUpdate').textContent = 'Configura la URL del servidor abajo';
    return;
  }
  try {
    const res = await fetch(`${serverUrl}/status`);
    const data = await res.json();
    renderDevices(data);
    const now = new Date();
    document.getElementById('lastUpdate').textContent =
      `actualizado · ${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
  } catch {
    document.getElementById('lastUpdate').textContent = 'error al conectar · reintentando...';
    document.getElementById('deviceList').innerHTML =
      '<div class="empty-state">No se pudo conectar.<br/>Verifica la URL del servidor.</div>';
  }
}

if (!window.matchMedia('(display-mode: standalone)').matches) {
  document.getElementById('installHint').style.display = 'block';
}

fetchStatus();
interval = setInterval(fetchStatus, 60000);
</script>
</body>
</html>
